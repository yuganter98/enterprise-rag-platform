name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: enterprise_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -v

      - name: Migrations and seeding on Postgres
        env:
          SECRET_KEY: ci-secret-key-0123456789-0123456789-abcdef
          POSTGRES_SERVER: localhost
          POSTGRES_PASSWORD: ci-password
          FIRST_SUPERUSER_PASSWORD: ci-admin-password
        run: |
          alembic upgrade head
          python -m app.initial_data
          python -m app.initial_data  # idempotent

  frontend:
    name: Frontend (type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # pnpm version comes from "packageManager"
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SECRET_KEY: ci-secret-key-0123456789-0123456789-abcdef
      FIRST_SUPERUSER_PASSWORD: ci-admin-password
      POSTGRES_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Check API and frontend
        run: |
          curl --fail --silent http://localhost:8000/health
          curl --fail --silent --output /dev/null http://localhost:5173/
          curl --fail --silent --output /dev/null http://localhost:5173/login  # SPA fallback
          curl --fail --silent \
            --data-urlencode "username=admin@enterprise.com" \
            --data-urlencode "password=${FIRST_SUPERUSER_PASSWORD}" \
            http://localhost:8000/api/v1/login/access-token | grep -q access_token

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
